server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Aligné sur ComplianceService::MAX_SIZE_KB (8 Mo) et la limite d'upload
    # des photos de villa, avec la marge du multipart.
    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Ferme tout fichier caché (.env, .git, ...) sauf /.well-known/, requis
    # par exemple pour la validation de domaine ou Let's Encrypt.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
