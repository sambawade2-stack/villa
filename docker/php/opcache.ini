opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
; À 0, un déploiement n'est visible qu'après un redémarrage explicite du
; conteneur — plus rapide, mais un oubli fait tourner l'ancien code
; indéfiniment. 2 secondes reste un bon compromis sans pipeline de déploiement
; mature qui viderait le cache lui-même à chaque mise en production.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
